<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="1200" height="270" rx="18" fill="#0a1224"/>
<text x="40" y="44" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#22d3ee">A PACKET'S JOURNEY</text>
<text x="40" y="68" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#94a3b8">Every hop is a decision. Understanding each one is how you learn to defend the path.</text>
<line x1="90" y1="140" x2="1110" y2="140" stroke="#4f8cff" stroke-opacity="0.35" stroke-width="3"/>
<line x1="90" y1="140" x2="1110" y2="140" stroke="#22d3ee" stroke-width="3" stroke-dasharray="8 8"><animate attributeName="stroke-dashoffset" values="32;0" dur="1.6s" repeatCount="indefinite"/></line>
<circle cx="90" cy="140" r="38" fill="none" stroke="#4f8cff" stroke-width="3" opacity="0"><animate attributeName="opacity" values="1;0;0" keyTimes="0;0.1;1" dur="6s" repeatCount="indefinite"/></circle><circle cx="90" cy="140" r="26" fill="#111c33" stroke="#4f8cff" stroke-width="3"/><circle cx="90" cy="140" r="8" fill="#4f8cff"/><text x="90" y="200" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#f1f5f9">Your device</text><text x="90" y="224" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#94a3b8">the packet starts here</text><circle cx="350" cy="140" r="38" fill="none" stroke="#4f8cff" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.25;0.35;1" dur="6s" repeatCount="indefinite"/></circle><circle cx="350" cy="140" r="26" fill="#111c33" stroke="#4f8cff" stroke-width="3"/><circle cx="350" cy="140" r="8" fill="#4f8cff"/><text x="350" y="200" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#f1f5f9">Switch</text><text x="350" y="224" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#94a3b8">forwards by MAC</text><circle cx="610" cy="140" r="38" fill="none" stroke="#22d3ee" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.50;0.60;1" dur="6s" repeatCount="indefinite"/></circle><circle cx="610" cy="140" r="26" fill="#111c33" stroke="#22d3ee" stroke-width="3"/><circle cx="610" cy="140" r="8" fill="#22d3ee"/><text x="610" y="200" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#f1f5f9">Router</text><text x="610" y="224" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#94a3b8">routes by IP</text><circle cx="870" cy="140" r="38" fill="none" stroke="#22d3ee" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.75;0.85;1" dur="6s" repeatCount="indefinite"/></circle><circle cx="870" cy="140" r="26" fill="#111c33" stroke="#22d3ee" stroke-width="3"/><circle cx="870" cy="140" r="8" fill="#22d3ee"/><text x="870" y="200" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#f1f5f9">Firewall</text><text x="870" y="224" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#94a3b8">allow / deny rules</text><circle cx="1110" cy="140" r="38" fill="none" stroke="#34d399" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.9;1" dur="6s" repeatCount="indefinite"/></circle><circle cx="1110" cy="140" r="26" fill="#111c33" stroke="#34d399" stroke-width="3"/><circle cx="1110" cy="140" r="8" fill="#34d399"/><text x="1110" y="200" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#f1f5f9">Destination</text><text x="1110" y="224" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#94a3b8">server on the internet</text><g><circle r="11" fill="#22d3ee" opacity="0.3"/><circle r="6" fill="#ffffff"/><animateMotion path="M90 140 L1110 140" dur="6s" repeatCount="indefinite"/></g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>